name: PR Review Smoke Tests
on:
  pull_request:
    branches: [ main, master ]

jobs:
  pr-review:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run impacted smoke tests via PR review automation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node ./test-runner.js --repository $GITHUB_REPOSITORY --prNumber $PR_NUMBER

      - name: Generate Allure report
        if: ${{ always() }}
        run: npx allure-commandline generate allure-results -o allure-report --clean

      - name: Upload Allure report artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30
